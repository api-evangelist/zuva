name: Zuva
kind: company
description: Zuva (by Kira Systems) provides a contract and document AI REST API for
  extracting structured data from unstructured documents. The Zuva DocAI API offers
  asynchronous OCR, field extraction across 1,400+ pre-built fields, multi-level
  document classification across 220+ document types, language detection, and a
  searchable fields catalog, secured with Bearer API tokens across US and EU regions.
