  baseURL: https://us.app.zuva.ai/api/v2
  properties:
  - url: https://zuva.ai/documentation/services/field-extraction/
    type: Documentation
  - url: https://api-reference.zuva.ai/
    type: APIReference
  - url: openapi/zuva-openapi.yml
    type: OpenAPI
  description: List and manage the catalog of available extraction fields, including
    creating custom fields and reading or updating field metadata such as name and
    description.
