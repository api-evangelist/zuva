meters:
- name: documents_processed
  description: Documents processed, billed at a per-document base charge.
  unit: documents
  aggregation: sum
  dimensions:
  - account
  - api
- name: extraction_field_pages
  description: Field extraction billed per field, per page across requested fields.
  unit: field_pages
  aggregation: sum
  dimensions:
  - account
  - field
- name: ocr_pages
  description: Pages processed by the OCR service, metered per page.
  unit: pages
  aggregation: sum
  dimensions:
  - account
- name: classifications
  description: Documents classified via the multi-level classification service.
  unit: documents
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track per-token API key usage in the Zuva Dashboard; inspect document, field, and page burn per workload.
- name: Allocation
  description: Issue separate API tokens per workload/team and map them to internal cost centers.
- name: Optimization
  description: Limit extraction to the field IDs you need; batch files into single requests (up to 100 file/field IDs); reuse OCR output across services to avoid reprocessing.
- name: Accountability
  description: Assign owners per project/token; review document and extraction spend monthly against the pay-as-you-go commitment.
