description: >-
  FinOps view of Zuva DocAI spend. Zuva bills usage-based: a per-document base
  charge when a document is processed, per-field, per-page charges for field
  extraction, and metered charges for OCR and classification. A free developer
  tier provides limited daily processing, and pay-as-you-go usage is subject to
  a minimum commitment. Exact per-unit rates are not publicly published.
notes: >-
  Per-document, per-field, and per-page rates are not published; verify against
  Zuva pricing and contract terms during reconciliation.
